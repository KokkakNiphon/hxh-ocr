[package]
name = "hxh-synth"
description = "Synthetic Hunter-alphabet manga/anime pages with text-line ground truth (detector training data) and DBNet targets"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "hxh-synth"
path = "src/main.rs"

[dependencies]
tiny-skia = { version = "0.11.4", default-features = false, features = ["std", "simd", "png-format"] }
jpeg-encoder = "0.6.1"
zune-jpeg = "0.5.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.11"
zune-core = "0.5"
png = "0.17"
# glyph outlines / metrics of system fonts read at run time (foreign-text distractors); pure Rust
ab_glyph = "=0.2.32"
# line crops exactly like the browser pipeline (`lines` command)
hxh-detect = { path = "../hxh-detect" }
