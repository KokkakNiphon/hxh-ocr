<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HxH OCR social card (source for og.png)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@500;600;700&family=Geist+Mono:wght@500&family=Manrope:wght@500;600&display=swap">
<style>
  /* rendered to web/og.png at 1200 x 630 by scripts/render_brand.py (headless Chrome) */
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #0b0c0f; color: #f1f2f4; font-family: "Manrope", system-ui, sans-serif; position: relative; }
  .glow { position: absolute; inset: -200px auto auto -160px; width: 760px; height: 760px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(112, 136, 255, 0.22), rgba(112, 136, 255, 0)); }
  .left { position: absolute; left: 72px; top: 64px; width: 560px; }
  .brand { display: flex; align-items: center; gap: 16px; font: 600 34px "Geist", sans-serif; letter-spacing: -0.01em; }
  .brand img { width: 64px; height: 64px; }
  h1 { font: 700 60px/1.06 "Geist", sans-serif; letter-spacing: -0.025em; margin: 44px 0 0; text-wrap: balance; }
  h1 em { font-style: normal; color: #93a5ff; }
  p { font: 500 24px/1.4 "Manrope", sans-serif; color: #c6c9cf; margin: 22px 0 0; }
  .foot { position: absolute; left: 72px; bottom: 52px; font: 500 18px "Geist Mono", monospace; color: #8c919a; }
  .shot { position: absolute; right: -40px; top: 92px; width: 560px; border-radius: 14px; overflow: hidden;
    box-shadow: 0 0 0 1px #353943, 0 30px 80px rgba(0, 0, 0, 0.55); transform: rotate(-3deg); }
  .shot img { display: block; width: 100%; }
  .tag { position: absolute; right: 72px; bottom: 52px; font: 600 18px "Geist", sans-serif; color: #0b0c0f; background: #93a5ff; padding: 8px 14px; border-radius: 999px; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="left">
    <div class="brand"><img src="mark-dark.svg" alt="">HxH OCR</div>
    <h1>The first OCR for the <em>Hunter × Hunter</em> alphabet</h1>
    <p>Reads whole manga pages, across and down, right in your browser.</p>
  </div>
  <div class="shot"><img src="../blog/img/pipeline/05_boxes.webp" alt=""></div>
  <div class="foot">hxh-ocr.kokkakniphon.workers.dev</div>
  <div class="tag">Free · runs on your phone</div>
</body>
</html>
